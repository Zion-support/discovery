name: Catalog health watchdog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "public/index.html"
      - "public/data/zion-catalog.json"
      - "public/assets/js/zion-catalog.js"
      - ".github/workflows/catalog-health.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live homepage advertising + catalog JS
        run: |
          set -euo pipefail
          # Homepage hero/content rotates; fetch 5x with timeouts and combine to avoid flakes
          fetch() {
            local url="$1" out=""
            for i in 1 2 3 4 5; do
              out="$out$(curl -fsSL -m 20 -A 'zion-catalog-watchdog/2.0' "$url" || true)"
              sleep 3
            done
            printf '%s' "$out"
          }
          html="$(fetch https://ziontechgroup.com/)"
          if [ -z "$html" ]; then echo "WARN: homepage fetch empty after 5 tries (transient)"; exit 0; fi
          must=(
            # Current EN homepage (Next.js) — re-verified 2026-10-03.
            # /app-network/ removed (404); /zion-app-network/ is NOT linked on the
            # homepage, so it is covered only by the route probe below (200 OK).
            "Discovery"
            "FinOps"
            "/plans/"
            "/services/"
            "/blog/"
            "/managed-it-services/"
            "/ai-consulting-services/"
          )
          fail=0
          for s in "${must[@]}"; do
            if ! grep -Fq "$s" <<< "$html"; then
              echo "MISSING on homepage: $s"
              fail=1
            else
                echo "OK: $s"
            fi
          done
          js="$(fetch https://ziontechgroup.com/assets/js/zion-catalog.js)"
          if [ -z "$js" ]; then echo "WARN: catalog JS fetch empty after 5 tries (transient)"; exit 0; fi
          js_must=(
            "Free Discovery"
            "Agentes Telegram"
            "Estimador FinOps"
            "ensureFinops"
            "finops-form"
          )
          for s in "${js_must[@]}"; do
            if ! grep -Fq "$s" <<< "$js"; then
              echo "MISSING in catalog JS: $s"
              fail=1
            else
                echo "OK JS: $s"
            fi
          done
          routes=(
            https://ziontechgroup.com/
            https://ziontechgroup.com/services/
            https://ziontechgroup.com/agents/
            https://ziontechgroup.com/plans/
            https://ziontechgroup.com/discovery/
            https://ziontechgroup.com/booking/
            https://ziontechgroup.com/cpa/
            https://ziontechgroup.com/free-ai-it-tools/
            https://ziontechgroup.com/academy/
            https://ziontechgroup.com/blog/
            https://ziontechgroup.com/telegram/
            https://ziontechgroup.com/pricing/
            https://ziontechgroup.com/finops-consulting/
            https://ziontechgroup.com/zion-app-network/
            https://ziontechgroup.com/assets/js/zion-catalog.js
          )
          for u in "${routes[@]}"; do
            code=$(curl -sI -m 20 -o /dev/null -w "%{http_code}" "$u" || echo 000)
            echo "$code $u"
            case "$code" in
              200|301|302) ;;
              000) echo "WARN timeout $u (transient)" ;;
              *) echo "BAD STATUS $code $u"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "Watchdog found gaps."
            exit 1
            fi
            echo "Watchdog green."
